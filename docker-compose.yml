services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripgo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tripgo-db:/var/lib/postgresql/data
    healthcheck:
      # App chỉ khởi động khi Postgres thật sự nhận kết nối (ddl-auto=update chạy ngay lúc boot).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tripgo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tripgo}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Bắt buộc — đặt trong file .env cạnh compose (xem .env.example). Không dùng cú pháp
      # ${VAR:?...} vì Compose nội suy file cho MỌI lệnh con, sẽ chặn cả `logs`/`ps`/`down`
      # khi biến trống. Thiếu biến thì ứng dụng tự báo lỗi rõ ràng lúc khởi động.
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      RATE_LIMIT_AUTH_WINDOW: ${RATE_LIMIT_AUTH_WINDOW:-60}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  tripgo-db:
