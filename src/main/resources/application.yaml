spring:
  application:
    name: tripgo

  datasource:
    url: jdbc:postgresql://localhost:5432/tripgo
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: 0123456789012345678901234567890123456789012345678901234567890123
  #24h
  expiration: 86400000
