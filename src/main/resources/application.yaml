spring:
  application:
    name: tripgo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripgo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # Mặc định của Spring chỉ 1MB; nới ra cho khớp giới hạn 5MB của storage bên dưới.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
# Không dùng context-path: tiền tố /api/v1 do ApiPathConfig gắn riêng cho package controller,
# để khu quản trị /admin/** nằm ngoài tiền tố đó.

jwt:
  secret: ${JWT_SECRET}
  # 24h
  expiration: ${JWT_EXPIRATION:86400000}

# Origin được phép gọi API (CSV). Mặc định "*" cho dev; prod nên set CORS_ALLOWED_ORIGINS cụ thể.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Đăng nhập Facebook. Bỏ trống client-id -> tính năng không bật, app vẫn chạy bình thường.
# Lấy giá trị ở https://developers.facebook.com/apps -> App settings -> Basic.
social:
  login:
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
    # Có giá trị -> callback redirect về frontend kèm ?token=<JWT>.
    # Bỏ trống -> trả JSON { token, user } ngay tại callback (tiện thử bằng trình duyệt).
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:}

# Ảnh admin tải lên. Lưu ngoài classpath để không mất khi đóng gói lại (xem StorageProperties).
storage:
  upload-dir: ${UPLOAD_DIR:./uploads}
  public-path: /uploads
  max-file-size-bytes: ${UPLOAD_MAX_BYTES:5242880}

# Tài khoản quản trị đầu tiên, tạo lúc khởi động nếu email chưa tồn tại (xem AdminAccountSeeder).
# Bỏ trống -> không tạo gì cả.
admin:
  seed:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Quản trị viên}

# Rate limit chống brute-force cho POST /auth/** (số request mỗi IP mỗi cửa sổ).
ratelimit:
  auth:
    max-requests: ${RATE_LIMIT_AUTH_MAX:20}
    window-seconds: ${RATE_LIMIT_AUTH_WINDOW:60}
