<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: page(~{::title}, ~{::main})}" lang="vi">
<head>
    <title>Dashboard · TripGo Admin</title>
</head>
<body>
<main class="admin-content">
    <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
        <a class="btn-secondary" th:href="@{/admin/reports/revenue/export}">⭳ Xuất doanh thu tháng</a>
    </div>

    <div class="stat-grid">
        <a class="stat-card" th:href="@{/admin/tours}">
            <span class="stat-label">Tổng tour đang bán</span>
            <span class="stat-value" th:text="${stats.totalTours}">0</span>
        </a>
        <!--/* Bấm vào ô là sang thẳng danh sách đã lọc sẵn - đây là việc admin làm tiếp
               ngay sau khi nhìn thấy con số. */-->
        <a class="stat-card" th:href="@{/admin/bookings(status='PENDING')}">
            <span class="stat-label">Đơn chờ xác nhận</span>
            <span class="stat-value" th:text="${stats.pendingBookings}">0</span>
        </a>
        <a class="stat-card" th:href="@{/admin/bookings}">
            <span class="stat-label">Đơn tháng này</span>
            <span class="stat-value" th:text="${stats.bookingsThisMonth}">0</span>
        </a>
        <div class="stat-card">
            <span class="stat-label">Doanh thu tháng</span>
            <span class="stat-value"
                  th:text="${#numbers.formatInteger(stats.revenueThisMonth, 0, 'POINT')} + ' đ'">0 đ</span>
            <span class="stat-note">Không tính đơn đã huỷ</span>
        </div>
    </div>

    <section class="chart-grid">
        <figure class="chart-card">
            <figcaption>
                <h2 class="chart-title">Doanh thu 6 tháng gần nhất</h2>
                <p class="chart-note">Không tính đơn đã huỷ</p>
            </figcaption>
            <div class="chart-box"><canvas id="revenueTrend"></canvas></div>
            <!--/* Bảng số liệu kèm theo: biểu đồ không được là cách DUY NHẤT đọc được con số
                   (người dùng trình đọc màn hình, và cả lúc in ra giấy). */-->
            <details class="chart-table">
                <summary>Xem dạng bảng</summary>
                <table class="data-table" id="revenueTrendTable">
                    <thead><tr><th>Tháng</th><th class="num">Số đơn</th><th class="num">Doanh thu</th></tr></thead>
                    <tbody></tbody>
                </table>
            </details>
        </figure>

        <figure class="chart-card">
            <figcaption>
                <h2 class="chart-title">Tour doanh thu cao nhất tháng này</h2>
                <p class="chart-note">Tối đa 5 tour</p>
            </figcaption>
            <div class="chart-box"><canvas id="topTours"></canvas></div>
            <p class="chart-empty" id="topToursEmpty" hidden>Tháng này chưa có đơn nào</p>
            <details class="chart-table">
                <summary>Xem dạng bảng</summary>
                <table class="data-table" id="topToursTable">
                    <thead><tr><th>Tour</th><th class="num">Doanh thu</th></tr></thead>
                    <tbody></tbody>
                </table>
            </details>
        </figure>
    </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:src="@{/js/admin-charts.js}"></script>
</body>
</html>
