<!DOCTYPE html>
<!--/*
  Khung dùng chung cho mọi trang quản trị. Trang con khai:
      <html th:replace="~{admin/layout :: page(~{::title}, ~{::main})}">
  rồi chỉ viết <title> và <main> của riêng nó.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(pageTitle, content)" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${pageTitle}">TripGo Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-shell">

    <aside class="admin-sidebar">
        <div class="admin-brand">TripGo<span>Admin</span></div>
        <nav>
            <a th:href="@{/admin}" th:classappend="${activeMenu == 'dashboard'} ? 'active'">Dashboard</a>
            <a th:href="@{/admin/tours}" th:classappend="${activeMenu == 'tours'} ? 'active'">Tour</a>
            <a th:href="@{/admin/bookings}" th:classappend="${activeMenu == 'bookings'} ? 'active'">Đơn đặt</a>
            <a th:href="@{/admin/destinations}" th:classappend="${activeMenu == 'destinations'} ? 'active'">Điểm đến</a>
            <hr>
            <!--/* Đăng xuất phải là POST: GET sẽ bị CSRF chặn, và cũng để tránh bị đăng xuất
                   ngoài ý muốn qua một thẻ <img> trỏ tới URL đó. */-->
            <form th:action="@{/admin/logout}" method="post" class="logout-form">
                <button type="submit">Đăng xuất</button>
            </form>
        </nav>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <span class="admin-topbar-title" th:text="${pageHeading} ?: 'Quản trị'">Quản trị</span>
            <span class="admin-topbar-user" th:if="${currentAdmin}" th:text="${currentAdmin}">admin@tripgo</span>
        </header>

        <!--/* Thông báo sau khi chuyển hướng (xoá/khôi phục/lưu). Dùng flash attribute nên
               F5 lại trang là mất, không hiện lặp. */-->
        <div th:if="${flashMessage}" class="admin-content flash-wrap">
            <p class="flash" th:text="${flashMessage}"
               th:classappend="${flashType == 'error'} ? 'flash-error' : 'flash-success'">Thông báo</p>
        </div>

        <main class="admin-content" th:replace="${content}">
            <p>Nội dung trang</p>
        </main>
    </div>

</div>
</body>
</html>
