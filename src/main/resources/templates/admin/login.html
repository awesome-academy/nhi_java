<!DOCTYPE html>
<!--/* Trang đăng nhập KHÔNG dùng layout chung: chưa đăng nhập thì không có sidebar/topbar. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập · TripGo Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-body">

<div class="login-card">
    <h1 class="login-title">TripGo Admin</h1>

    <p th:if="${message}"
       th:text="${message}"
       th:classappend="${messageType == 'error'} ? 'login-alert-error' : 'login-alert-info'"
       class="login-alert">Thông báo</p>

    <!--/* th:action tự chèn input _csrf ẩn; thiếu nó Spring Security trả 403. */-->
    <form th:action="@{/admin/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="username">

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit">Đăng nhập</button>
    </form>
</div>

</body>
</html>
