<!DOCTYPE html>
<!--/*
  Trang 404 cho trình duyệt. Client gọi API gửi Accept: application/json vẫn nhận JSON như cũ —
  BasicErrorController của Spring Boot tự chọn theo content negotiation.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Không tìm thấy trang · TripGo</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-body">
<div class="login-card error-card">
    <p class="error-status">404</p>
    <h1 class="error-title">Không tìm thấy trang</h1>
    <p class="error-path" th:if="${path}" th:text="${path}">/admin/gi-do</p>
    <!--/* Chỉ mời về Dashboard khi người dùng đang ở trong khu quản trị. */-->
    <a th:if="${path != null and #strings.startsWith(path, '/admin')}"
       th:href="@{/admin}" class="error-link">← Về Dashboard</a>
</div>
</body>
</html>
